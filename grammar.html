<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar | Hibiki</title><style>
:root{--navy:#10243e;--blue:#174d82;--red:#c9273b;--gold:#d5ad58;--ink:#1e293b;--muted:#64748b;--bg:#f5f8fc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
header{background:linear-gradient(120deg,#0d2038,#174d82);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:1.15rem;font-weight:800;letter-spacing:.04em}.brand span{color:#f0cc78}
nav{display:flex;gap:8px;flex-wrap:wrap}nav a{color:#eaf2fb;text-decoration:none;padding:7px 11px;border-radius:9px;font-size:.92rem}nav a:hover,nav a.active{background:#ffffff24}
main{max-width:1100px;margin:28px auto;padding:0 16px}.hero{background:linear-gradient(120deg,#fff,#edf4fb);border:1px solid #dce7f2;border-radius:20px;padding:26px;margin-bottom:20px}
.eyebrow{color:var(--red);font-weight:800;font-size:.82rem;letter-spacing:.08em}.hero h1{margin:5px 0 8px;color:var(--navy);font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.25}.hero p{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit;min-width:180px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:var(--card);border:1px solid #e2e8f0;border-radius:15px;padding:18px;box-shadow:0 5px 18px #10243e0a}.card h2,.card h3{margin:0 0 8px;color:var(--navy)}.jp{font-size:1.35rem;font-weight:800;color:var(--blue)}.meta{color:var(--muted);font-size:.9rem}.pill{display:inline-block;background:#edf4fb;color:var(--blue);padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:700;margin:4px 4px 0 0}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:var(--navy)}.empty{display:none;text-align:center;padding:24px;color:var(--muted)}footer{text-align:center;padding:28px 16px;color:var(--muted);font-size:.88rem}
@media(max-width:560px){header{padding:15px 4%}nav{width:100%}nav a{padding:6px 8px;font-size:.85rem}.hero{padding:20px}.toolbar input,.toolbar select{min-width:100%}}
</style></head><body><header><div class="brand">HIBIKI <span>日本語</span></div><nav>
<a href="index.html">হোম</a><a href="vocabulary.html" >Vocabulary</a><a href="grammar.html" class="active">Grammar</a><a href="kanji.html">Kanji</a>
</nav></header>
<main><section class="hero"><div class="eyebrow">JAPANESE GRAMMAR</div><h1>জাপানি ব্যাকরণ সহজভাবে শিখুন</h1><p>প্রাথমিক পর্যায়ের কিছু নমুনা Grammar pattern, বাংলা ব্যাখ্যা ও উদাহরণসহ।</p></section>
<div class="toolbar"><input id="search" placeholder="Grammar / বাংলা ব্যাখ্যা খুঁজুন…"><select id="level"><option value="all">সব লেভেল</option><option value="N5">JLPT N5</option></select></div><div class="grid" id="list"></div><p class="empty" id="empty">কোনো Grammar পাওয়া যায়নি।</p></main><footer>HIBIKI Japanese Language Centre · Grammar Practice</footer>
<script>
const data=[
{level:"N5",title:"N は N です",meaning:"N হলো N / পরিচয় বা অবস্থা বোঝাতে",ex:"わたしは がくせいです。",romaji:"Watashi wa gakusei desu.",bn:"আমি একজন শিক্ষার্থী।",note:"は (wa) বিষয় নির্দেশ করে; です বাক্যকে ভদ্র রূপ দেয়।"},
{level:"N5",title:"N は N じゃありません",meaning:"N হলো না / অস্বীকার",ex:"わたしは せんせいじゃありません。",romaji:"Watashi wa sensei ja arimasen.",bn:"আমি শিক্ষক নই।",note:"じゃありません হলো です-এর নেতিবাচক ভদ্র রূপ।"},
{level:"N5",title:"これ / それ / あれ",meaning:"এটি / ওটি / ওই দূরেরটি",ex:"これは ほんです。",romaji:"Kore wa hon desu.",bn:"এটি একটি বই।",note:"これ বক্তার কাছে, それ শ্রোতার কাছে, あれ দুজনের থেকেই দূরে।"},
{level:"N5",title:"N の N",meaning:"সম্পর্ক, মালিকানা বা পরিচয় বোঝায়",ex:"わたしの ほんです。",romaji:"Watashi no hon desu.",bn:"এটি আমার বই।",note:"の সাধারণত দুটি বিশেষ্যকে যুক্ত করে।"},
{level:"N5",title:"ここ / そこ / あそこ",meaning:"এখানে / সেখানে / ওখানে",ex:"ここは きょうしつです。",romaji:"Koko wa kyoushitsu desu.",bn:"এখানে শ্রেণিকক্ষ।",note:"স্থান নির্দেশ করতে ব্যবহৃত হয়।"}
];
function render(){let q=search.value.toLowerCase().trim();let a=data.filter(x=>[x.title,x.meaning,x.ex,x.romaji,x.bn,x.note].some(v=>v.toLowerCase().includes(q)));list.innerHTML=a.map(x=>`<article class="card"><span class="pill">${x.level}</span><h2>${x.title}</h2><b>${x.meaning}</b><hr><div class="jp">${x.ex}</div><div>${x.romaji}</div><p><b>বাংলা:</b> ${x.bn}</p><div class="meta">${x.note}</div></article>`).join("");empty.style.display=a.length?"none":"block"}search.addEventListener("input",render);level.addEventListener("change",render);render();
</script></body></html>
