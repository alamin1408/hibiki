<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N5 Quiz | Hibiki</title><style>
:root{--navy:#10243e;--blue:#174d82;--red:#c9273b;--gold:#d5ad58;--ink:#1e293b;--muted:#64748b;--bg:#f5f8fc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
header{background:linear-gradient(120deg,#0d2038,#174d82);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:1.1rem;font-weight:800;letter-spacing:.04em}.brand span{color:#f0cc78}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#eaf2fb;text-decoration:none;padding:7px 10px;border-radius:9px;font-size:.9rem}nav a:hover{background:#ffffff24}
main{max-width:1100px;margin:26px auto;padding:0 16px}.hero{background:linear-gradient(120deg,#fff,#edf4fb);border:1px solid #dce7f2;border-radius:20px;padding:24px;margin-bottom:18px}.eyebrow{color:var(--red);font-weight:800;font-size:.8rem;letter-spacing:.08em}.hero h1{margin:5px 0;color:var(--navy);font-size:clamp(1.6rem,4vw,2.35rem);line-height:1.3}.hero p{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit;min-width:180px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:17px;box-shadow:0 5px 18px #10243e0a}.card h2,.card h3{margin:0 0 7px;color:var(--navy)}.jp{font-size:1.3rem;font-weight:800;color:var(--blue)}.meta{color:var(--muted);font-size:.9rem}.pill{display:inline-block;background:#edf4fb;color:var(--blue);padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:700;margin:3px}.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:var(--navy)}.empty{display:none;text-align:center;padding:24px;color:var(--muted)}.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#2c9a71;width:0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}footer{text-align:center;padding:25px;color:var(--muted);font-size:.88rem}
@media(max-width:560px){header{padding:14px 4%}nav{width:100%}nav a{padding:6px 8px;font-size:.82rem}.hero{padding:19px}.toolbar input,.toolbar select{min-width:100%}}
.question{font-size:1.2rem;font-weight:800;color:var(--navy);margin:12px 0}.option{display:block;width:100%;text-align:left;margin:8px 0;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit;cursor:pointer}.option:hover{border-color:var(--blue);background:#f2f7fc}.option.correct{border-color:#23835e;background:#e9f8f0}.option.wrong{border-color:#c9273b;background:#fff0f1}</style></head><body><header><div class="brand">HIBIKI <span>日本語</span></div><nav><a href="index.html">হোম</a><a href="vocabulary.html">Vocabulary</a><a href="grammar.html">Grammar</a><a href="kanji.html">Kanji</a><a href="quiz.html">Quiz</a></nav></header><main><section class="hero"><div class="eyebrow">JLPT N5 · PRACTICE</div><h1>Vocabulary Quiz</h1><p>নমুনা কুইজ: সঠিক বাংলা অর্থ নির্বাচন করুন। ফলাফল এই সেশনে দেখানো হবে।</p></section><section class="card"><div class="row"><span class="pill" id="count">প্রশ্ন ১</span><span class="pill" id="score">স্কোর: ০</span></div><div class="bar"><span id="bar"></span></div><div class="question" id="question"></div><div id="options"></div><p id="feedback" aria-live="polite"></p><button class="btn" id="next" disabled>পরের প্রশ্ন</button><button class="btn secondary" id="restart" style="display:none">আবার শুরু করুন</button></section></main><footer>HIBIKI Japanese Language Centre</footer><script>
const qs=[
{q:"わたし (watashi)",a:"আমি",o:["আমি","আপনি","শিক্ষক","বই"]},
{q:"せんせい (sensei)",a:"শিক্ষক",o:["শিক্ষার্থী","শিক্ষক","ডাক্তার","কর্মচারী"]},
{q:"ほん (hon)",a:"বই",o:["খাতা","ব্যাগ","বই","চাবি"]},
{q:"かばん (kaban)",a:"ব্যাগ",o:["ব্যাগ","ছাতা","জুতা","ঘড়ি"]},
{q:"みず (mizu)",a:"পানি",o:["আগুন","পাহাড়","নদী","পানি"]},
{q:"やま (yama)",a:"পাহাড়",o:["নদী","পাহাড়","মানুষ","সূর্য"]},
{q:"どこ (doko)",a:"কোথায়",o:["কে","কী","কোথায়","কত দাম"]},
{q:"がくせい (gakusei)",a:"শিক্ষার্থী",o:["শিক্ষার্থী","শিক্ষক","গবেষক","ডাক্তার"]}
];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);
function show(){$("count").textContent=`প্রশ্ন ${i+1} / ${qs.length}`;$("score").textContent=`স্কোর: ${score}`;$("bar").style.width=(i/qs.length*100)+"%";$("question").textContent=qs[i].q;$("feedback").textContent="";$("next").disabled=true;$("options").innerHTML="";answered=false;qs[i].o.forEach(v=>{let b=document.createElement("button");b.className="option";b.textContent=v;b.onclick=()=>choose(b,v);$("options").appendChild(b)})}
function choose(btn,v){if(answered)return;answered=true;let ok=v===qs[i].a;if(ok)score++;[...$("options").children].forEach(b=>{b.disabled=true;if(b.textContent===qs[i].a)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");$("feedback").textContent=ok?"সঠিক উত্তর!":"সঠিক উত্তর: "+qs[i].a;$("score").textContent=`স্কোর: ${score}`;$("next").disabled=false}
$("next").onclick=()=>{if(i<qs.length-1){i++;show()}else{$("question").textContent=`কুইজ শেষ! আপনার স্কোর ${score} / ${qs.length}`;$("options").innerHTML="";$("feedback").textContent="আবার অনুশীলন করতে চাইলে শুরু করুন।";$("next").style.display="none";$("restart").style.display="inline-block";$("bar").style.width="100%";$("count").textContent="সম্পন্ন"}};
$("restart").onclick=()=>{i=0;score=0;$("next").style.display="inline-block";$("restart").style.display="none";show()};show();
</script></body></html>
