<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar | Hibiki</title><style>
:root{--navy:#10243e;--blue:#174d82;--red:#c9273b;--gold:#d5ad58;--ink:#1e293b;--muted:#64748b;--bg:#f5f8fc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
header{background:linear-gradient(120deg,#0d2038,#174d82);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:1.1rem;font-weight:800;letter-spacing:.04em}.brand span{color:#f0cc78}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#eaf2fb;text-decoration:none;padding:7px 10px;border-radius:9px;font-size:.9rem}nav a:hover{background:#ffffff24}
main{max-width:1100px;margin:26px auto;padding:0 16px}.hero{background:linear-gradient(120deg,#fff,#edf4fb);border:1px solid #dce7f2;border-radius:20px;padding:24px;margin-bottom:18px}.eyebrow{color:var(--red);font-weight:800;font-size:.8rem;letter-spacing:.08em}.hero h1{margin:5px 0;color:var(--navy);font-size:clamp(1.6rem,4vw,2.35rem);line-height:1.3}.hero p{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit;min-width:180px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:17px;box-shadow:0 5px 18px #10243e0a}.card h2,.card h3{margin:0 0 7px;color:var(--navy)}.jp{font-size:1.3rem;font-weight:800;color:var(--blue)}.meta{color:var(--muted);font-size:.9rem}.pill{display:inline-block;background:#edf4fb;color:var(--blue);padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:700;margin:3px}.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:var(--navy)}.empty{display:none;text-align:center;padding:24px;color:var(--muted)}.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#2c9a71;width:0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}footer{text-align:center;padding:25px;color:var(--muted);font-size:.88rem}
@media(max-width:560px){header{padding:14px 4%}nav{width:100%}nav a{padding:6px 8px;font-size:.82rem}.hero{padding:19px}.toolbar input,.toolbar select{min-width:100%}}
</style></head><body><header><div class="brand">HIBIKI <span>日本語</span></div><nav><a href="index.html">হোম</a><a href="vocabulary.html">Vocabulary</a><a href="grammar.html">Grammar</a><a href="kanji.html">Kanji</a><a href="quiz.html">Quiz</a></nav></header><main><section class="hero"><div class="eyebrow">JLPT N5 · GRAMMAR</div><h1>জাপানি ব্যাকরণ শিখুন</h1><p>প্রতিটি প্যাটার্নের বাংলা ব্যাখ্যা, উদাহরণ ও রোমাজি। সার্চ দিয়ে বিষয় খুঁজুন।</p></section><div class="toolbar"><input id="search" placeholder="Grammar / বাংলা ব্যাখ্যা খুঁজুন…"></div><div class="grid" id="list"></div><p class="empty" id="empty">কোনো Grammar পাওয়া যায়নি।</p></main><footer>HIBIKI Japanese Language Centre</footer><script>
const data=[{"title": "N は N です", "meaning": "N হলো N — পরিচয় বা অবস্থা বোঝাতে", "ex": "わたしは がくせいです。", "romaji": "Watashi wa gakusei desu.", "bn": "আমি একজন শিক্ষার্থী।", "note": "は (wa) বাক্যের বিষয় নির্দেশ করে; です ভদ্র বাক্যরূপ।"}, {"title": "N は N じゃありません", "meaning": "N হলো না — নেতিবাচক পরিচয়", "ex": "わたしは せんせいじゃありません。", "romaji": "Watashi wa sensei ja arimasen.", "bn": "আমি শিক্ষক নই।", "note": "じゃありません হলো です-এর নেতিবাচক ভদ্র রূপ।"}, {"title": "N は N ですか", "meaning": "হ্যাঁ/না প্রশ্ন তৈরি", "ex": "あなたは がくせいですか。", "romaji": "Anata wa gakusei desu ka?", "bn": "আপনি কি শিক্ষার্থী?", "note": "বাক্যের শেষে か যোগ করলে ভদ্র প্রশ্ন হয়।"}, {"title": "N も", "meaning": "এটিও / তিনিও", "ex": "わたしも がくせいです。", "romaji": "Watashi mo gakusei desu.", "bn": "আমিও শিক্ষার্থী।", "note": "も পূর্বের তথ্যের সঙ্গে মিল বা অন্তর্ভুক্তি বোঝায়।"}, {"title": "N の N", "meaning": "সম্পর্ক, মালিকানা বা পরিচয়", "ex": "わたしの ほんです。", "romaji": "Watashi no hon desu.", "bn": "এটি আমার বই।", "note": "の দুটি বিশেষ্যকে যুক্ত করে।"}, {"title": "これ / それ / あれ", "meaning": "এটি / ওটি / ওই দূরেরটি", "ex": "これは ほんです。", "romaji": "Kore wa hon desu.", "bn": "এটি একটি বই।", "note": "これ বক্তার কাছে, それ শ্রোতার কাছে, あれ দুজনের থেকেই দূরে।"}, {"title": "この / その / あの + N", "meaning": "এই / ওই / ওই দূরের + বিশেষ্য", "ex": "この ほんは わたしのです。", "romaji": "Kono hon wa watashi no desu.", "bn": "এই বইটি আমার।", "note": "この・その・あの-এর পরে বিশেষ্য বসে।"}, {"title": "ここ / そこ / あそこ", "meaning": "এখানে / সেখানে / ওখানে", "ex": "ここは きょうしつです。", "romaji": "Koko wa kyoushitsu desu.", "bn": "এখানে শ্রেণিকক্ষ।", "note": "স্থান নির্দেশক শব্দ।"}];function render(){let q=search.value.toLowerCase().trim(),a=data.filter(x=>[x.title,x.meaning,x.ex,x.romaji,x.bn,x.note].some(v=>v.toLowerCase().includes(q)));list.innerHTML=a.map(x=>`<article class="card"><span class="pill">JLPT N5 · নমুনা</span><h2>${x.title}</h2><b>${x.meaning}</b><hr><div class="jp">${x.ex}</div><div>${x.romaji}</div><p><b>বাংলা:</b> ${x.bn}</p><div class="meta">${x.note}</div></article>`).join("");empty.style.display=a.length?"none":"block"}search.addEventListener("input",render);render();
</script></body></html>
