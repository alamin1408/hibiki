<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanji | Hibiki</title><style>
:root{--navy:#10243e;--blue:#174d82;--red:#c9273b;--gold:#d5ad58;--ink:#1e293b;--muted:#64748b;--bg:#f5f8fc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
header{background:linear-gradient(120deg,#0d2038,#174d82);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:1.1rem;font-weight:800;letter-spacing:.04em}.brand span{color:#f0cc78}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#eaf2fb;text-decoration:none;padding:7px 10px;border-radius:9px;font-size:.9rem}nav a:hover{background:#ffffff24}
main{max-width:1100px;margin:26px auto;padding:0 16px}.hero{background:linear-gradient(120deg,#fff,#edf4fb);border:1px solid #dce7f2;border-radius:20px;padding:24px;margin-bottom:18px}.eyebrow{color:var(--red);font-weight:800;font-size:.8rem;letter-spacing:.08em}.hero h1{margin:5px 0;color:var(--navy);font-size:clamp(1.6rem,4vw,2.35rem);line-height:1.3}.hero p{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit;min-width:180px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:17px;box-shadow:0 5px 18px #10243e0a}.card h2,.card h3{margin:0 0 7px;color:var(--navy)}.jp{font-size:1.3rem;font-weight:800;color:var(--blue)}.meta{color:var(--muted);font-size:.9rem}.pill{display:inline-block;background:#edf4fb;color:var(--blue);padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:700;margin:3px}.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:var(--navy)}.empty{display:none;text-align:center;padding:24px;color:var(--muted)}.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#2c9a71;width:0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}footer{text-align:center;padding:25px;color:var(--muted);font-size:.88rem}
@media(max-width:560px){header{padding:14px 4%}nav{width:100%}nav a{padding:6px 8px;font-size:.82rem}.hero{padding:19px}.toolbar input,.toolbar select{min-width:100%}}
</style></head><body><header><div class="brand">HIBIKI <span>日本語</span></div><nav><a href="index.html">হোম</a><a href="vocabulary.html">Vocabulary</a><a href="grammar.html">Grammar</a><a href="kanji.html">Kanji</a><a href="quiz.html">Quiz</a></nav></header><main><section class="hero"><div class="eyebrow">JLPT N5 · KANJI</div><h1>কাঞ্জি অনুশীলন</h1><p>নমুনা কাঞ্জি, অর্থ, On/Kun Reading ও উদাহরণ।</p></section><div class="toolbar"><input id="search" placeholder="Kanji / Romaji / বাংলা অর্থ খুঁজুন…"></div><div class="grid" id="list"></div><p class="empty" id="empty">কোনো কাঞ্জি পাওয়া যায়নি।</p></main><footer>HIBIKI Japanese Language Centre</footer><script>
const data=[{"k": "日", "on": "ニチ・ジツ", "kun": "ひ・か", "r": "nichi / hi", "b": "দিন, সূর্য", "ex": "日本（にほん）— জাপান"}, {"k": "月", "on": "ゲツ・ガツ", "kun": "つき", "r": "getsu / tsuki", "b": "মাস, চাঁদ", "ex": "月曜日（げつようび）— সোমবার"}, {"k": "火", "on": "カ", "kun": "ひ", "r": "ka / hi", "b": "আগুন", "ex": "火曜日（かようび）— মঙ্গলবার"}, {"k": "水", "on": "スイ", "kun": "みず", "r": "sui / mizu", "b": "পানি", "ex": "水曜日（すいようび）— বুধবার"}, {"k": "木", "on": "モク・ボク", "kun": "き", "r": "moku / ki", "b": "গাছ, কাঠ", "ex": "木（き）— গাছ"}, {"k": "金", "on": "キン・コン", "kun": "かね", "r": "kin / kane", "b": "সোনা, টাকা", "ex": "お金（おかね）— টাকা"}, {"k": "土", "on": "ド・ト", "kun": "つち", "r": "do / tsuchi", "b": "মাটি", "ex": "土曜日（どようび）— শনিবার"}, {"k": "人", "on": "ジン・ニン", "kun": "ひと", "r": "jin / hito", "b": "মানুষ", "ex": "日本人（にほんじん）— জাপানি ব্যক্তি"}, {"k": "山", "on": "サン", "kun": "やま", "r": "san / yama", "b": "পাহাড়", "ex": "富士山（ふじさん）— মাউন্ট ফুজি"}, {"k": "川", "on": "セン", "kun": "かわ", "r": "sen / kawa", "b": "নদী", "ex": "川（かわ）— নদী"}, {"k": "口", "on": "コウ・ク", "kun": "くち", "r": "kou / kuchi", "b": "মুখ", "ex": "入口（いりぐち）— প্রবেশপথ"}, {"k": "目", "on": "モク・ボク", "kun": "め", "r": "moku / me", "b": "চোখ", "ex": "目（め）— চোখ"}];function render(){let q=search.value.toLowerCase().trim(),a=data.filter(x=>[x.k,x.on,x.kun,x.r,x.b,x.ex].some(v=>v.toLowerCase().includes(q)));list.innerHTML=a.map(x=>`<article class="card"><div class="jp" style="font-size:3rem">${x.k}</div><h3>${x.b}</h3><p><span class="pill">On: ${x.on}</span><span class="pill">Kun: ${x.kun}</span></p><div><b>Romaji:</b> ${x.r}</div><div class="meta">${x.ex}</div></article>`).join("");empty.style.display=a.length?"none":"block"}search.addEventListener("input",render);render();
</script></body></html>
